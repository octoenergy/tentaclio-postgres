services:
  postgres:
    image: postgres:9.5
    environment:
      POSTGRES_USER: circleci
      POSTGRES_DB: tentaclio-db
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circleci -d tentaclio-db"]
      interval: 2s
      timeout: 5s
      retries: 10
